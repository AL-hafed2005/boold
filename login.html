<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | IBDDMP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-crimson-600 selection:text-white">
    <div id="toastContainer" class="fixed bottom-4 left-4 right-4 sm:right-auto sm:max-w-sm sm:w-full z-50 flex flex-col gap-3 pointer-events-none"></div>
    <div id="app-nav"></div>

    <section class="py-16">
      <div class="max-w-md mx-auto px-4">
        <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200">
          <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-crimson-50 text-crimson-600 flex items-center justify-center mx-auto mb-3"><i data-lucide="lock" class="w-7 h-7"></i></div>
            <h2 class="text-2xl font-black text-slate-900">تسجيل الدخول</h2>
            <p class="text-xs text-slate-500 mt-1">للمدير والموظفين فقط</p>
          </div>
          <div id="loginError" class="hidden mb-4 p-3 rounded-xl bg-crimson-50 border border-crimson-200 text-crimson-700 text-xs font-bold"></div>
          <form id="loginForm" class="space-y-3">
            <div><label class="block text-xs font-bold text-slate-700 mb-1">البريد الإلكتروني</label>
              <input type="email" id="loginEmail" required dir="ltr" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-crimson-600 outline-none"></div>
            <div><label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label>
              <input type="password" id="loginPass" required dir="ltr" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-crimson-600 outline-none"></div>
            <button type="submit" class="w-full py-3.5 rounded-xl bg-crimson-600 hover:bg-crimson-700 text-white font-bold text-sm transition shadow-md">دخول</button>
          </form>
          <div class="relative flex py-5 items-center"><div class="flex-grow border-t border-slate-200"></div><span class="mx-3 text-xs text-slate-400 font-bold">أو</span><div class="flex-grow border-t border-slate-200"></div></div>
          <button id="demoBtn" class="w-full py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-sm transition flex items-center justify-center gap-2">
            <i data-lucide="sparkles" class="w-4 h-4 text-crimson-600"></i><span>تجربة محلية بدون سحابة (وضع اللجنة)</span>
          </button>
          <details class="mt-6 text-sm">
            <summary class="cursor-pointer font-bold text-slate-600 text-xs">أول تشغيل؟ إنشاء حساب مدير النظام</summary>
            <p class="text-[11px] text-slate-500 mt-2 mb-3 leading-relaxed">يعمل مرة واحدة فقط: أول حساب يُنشأ هنا يصبح المدير. بعدها يُنشئ المدير حسابات الموظفين من صفحة «الموظفون».</p>
            <div id="setupError" class="hidden mb-3 p-3 rounded-xl bg-crimson-50 border border-crimson-200 text-crimson-700 text-xs font-bold"></div>
            <form id="setupForm" class="space-y-3">
              <input type="text" id="setupName" required placeholder="الاسم الكامل" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-crimson-600 outline-none">
              <input type="email" id="setupEmail" required placeholder="البريد الإلكتروني" dir="ltr" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-crimson-600 outline-none">
              <input type="password" id="setupPass" required minlength="6" placeholder="كلمة المرور (6 أحرف فأكثر)" dir="ltr" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-crimson-600 outline-none">
              <button type="submit" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-crimson-600 text-white font-bold text-sm transition">إنشاء حساب المدير</button>
            </form>
          </details>
        </div>
      </div>
    </section>

    <div id="app-footer"></div>
    <script src="js/firebase-config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/store.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
